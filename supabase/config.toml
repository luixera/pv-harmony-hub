[functions.create-user]
verify_jwt = false

# Zé — a Evolution não tem JWT do Supabase (autentica pelo header x-ze-token);
# a ze-admin confere o Authorization e o papel por conta própria.
[functions.ze-webhook]
verify_jwt = false

[functions.ze-admin]
verify_jwt = false

[functions.ze-brain]
verify_jwt = false

# Ludmilla — quem chama é o worker da VPS, com a service role: ora o JWT legado,
# ora a chave nova (sb_secret_...), que o gateway não entende como JWT. A função
# confere o chamador por conta própria (chamadorEhServico) e vale com qualquer
# flag de deploy.
[functions.ludmilla-parecer]
verify_jwt = false
