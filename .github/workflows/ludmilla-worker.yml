name: Ludmilla — deploy do robô na VPS

# Execução MANUAL (aba Actions → este workflow → "Run workflow").
#
# O que faz: compila worker/ludmilla no CI, sincroniza para /opt/ludmilla na
# VPS e roda deploy/instalar.sh por SSH — que instala Node 22 e o Chromium
# (se faltarem), grava o ambiente em /etc/ludmilla/env e (re)inicia o serviço
# systemd `ludmilla-worker`. Idempotente.
#
# Segredos necessários (Settings → Secrets → Actions):
#   VPS_HOST, VPS_USER, VPS_SSH_PORT, VPS_SSH_KEY  — os mesmos do deploy do site
#   SUPABASE_URL                                   — https://yqsqrdndvsnhbsoaoilf.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY                      — chave service_role do projeto
#
# A service role é a chave que decifra as senhas dos portais (via RPC): ela
# só existe no segredo do GitHub e em /etc/ludmilla/env (600, root) na VPS.
# Nunca no repositório, nunca na conversa.

on:
  workflow_dispatch:
    inputs:
      simular:
        description: 'Só diagnosticar na VPS, sem instalar nada'
        type: boolean
        default: false

concurrency:
  group: ludmilla-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/ludmilla/package-lock.json

      - name: Testes do robô
        working-directory: worker/ludmilla
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

      - name: Compilar
        working-directory: worker/ludmilla
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.VPS_SSH_PORT }} -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sincronizar código
        if: ${{ !inputs.simular }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_SSH_PORT }} -o StrictHostKeyChecking=no"
          $SSH ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'mkdir -p /opt/ludmilla'
          # só o necessário para rodar: código compilado, manifesto e deploy
          rsync -avz --delete -e "$SSH" \
            --exclude='node_modules' --exclude='dist-test' --exclude='test' --exclude='src' \
            --exclude='_*' --exclude='*.png' \
            worker/ludmilla/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/ludmilla/

      - name: Instalar / reiniciar
        env:
          SIMULAR: ${{ inputs.simular }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_SSH_PORT }} -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "SIMULAR='$SIMULAR' SUPABASE_URL='$SUPABASE_URL' SUPABASE_SERVICE_ROLE_KEY='$SUPABASE_SERVICE_ROLE_KEY' bash -s" \
            < worker/ludmilla/deploy/instalar.sh
