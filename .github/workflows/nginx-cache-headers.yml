name: Nginx — cabeçalhos da casca (index.html, sw.js, manifest)

# Execução MANUAL (aba Actions → este workflow → "Run workflow").
#
# Por que existe: o `index.html` era servido sem `Cache-Control`. Sem diretiva,
# o navegador reutiliza a casca antiga do app por horas sem revalidar — e como
# os arquivos de /assets nunca são apagados no deploy (de propósito, para não
# quebrar quem está com a aba aberta), a casca velha continua achando o pacote
# velho e funcionando, silenciosamente desatualizada. Isso já fez três
# publicações "não chegarem" ao usuário (set/2026).
#
# O que faz hoje (out/2026, depois que o app virou PWA):
#   1. `index.html` → `Cache-Control: no-cache, must-revalidate`.
#   2. `sw.js` → o mesmo. O Chrome já ignora o cache HTTP do script do service
#      worker, mas Safari e proxies não prometem isso. Service worker velho
#      preso em cache é a pior falha possível: ele controla todas as páginas.
#   3. `manifest.webmanifest` → `application/manifest+json`. O Nginx o servia
#      como `application/octet-stream`, porque `.webmanifest` não está no
#      mime.types padrão.
#   4. Devolve os três cabeçalhos de segurança ao `index.html`. Esta é a
#      correção mais importante desta volta: no Nginx, um `add_header` dentro
#      de um `location` CANCELA todos os `add_header` herdados do `server`. O
#      bloco que esta automação criou em set/2026 para o cache acabou tirando
#      `X-Content-Type-Options`, `X-Frame-Options` e `Referrer-Policy` do
#      documento HTML — justo onde o `X-Frame-Options` protege de clickjacking.
#      Medido em 16/10/2026: `/sw.js` vinha com os três, `/` vinha sem nenhum.
#
# Idempotente e atualizável: remove o bloco que ele mesmo tenha inserido antes
# (tanto o formato de set/2026 quanto o atual) e insere a versão de agora.
# Rodar duas vezes seguidas não duplica nada.
#
# Segurança: backup datado, `nginx -t` ANTES de recarregar e restauração
# automática se a validação falhar — o site nunca fica com config quebrada.
#
# NOTA de shell: o comando remoto roda com `bash -s`, SEM `-e`. Com errexit a
# primeira execução morria no `grep` que procura a configuração — grep sai com
# 1 quando não acha, e o script terminava antes de imprimir o diagnóstico.

on:
  workflow_dispatch:
    inputs:
      desfazer:
        description: 'Desfazer: restaura o backup mais recente'
        type: boolean
        default: false
      simular:
        description: 'Só diagnosticar, sem alterar nada'
        type: boolean
        default: false

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.VPS_SSH_PORT }} -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Conexão
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_SSH_PORT }} -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'echo "conectado como $(whoami) em $(hostname)"'

      - name: Executar
        env:
          DESFAZER: ${{ inputs.desfazer }}
          SIMULAR: ${{ inputs.simular }}
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_SSH_PORT }} -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "DESFAZER='$DESFAZER' SIMULAR='$SIMULAR' bash -s" <<'REMOTO'
          # SEM `set -e`: o diagnóstico precisa sobreviver a comandos que falham.
          set -uo pipefail
          MARCA_VELHA="GD-MANAGER-CACHE-INDEX"
          INICIO="GD-MANAGER-CASCA-INICIO"
          FIM="GD-MANAGER-CASCA-FIM"

          # root ou sudo?
          if [ "$(id -u)" = "0" ]; then S=""; else S="sudo"; fi
          echo "usuário: $(whoami) | privilégio: ${S:-root}"

          # ── 1. Diagnóstico: onde está a configuração ────────────────────────
          echo "=== arquivos de configuração visíveis ==="
          $S ls -1 /etc/nginx/sites-enabled/ 2>/dev/null || echo "(sem sites-enabled)"
          $S ls -1 /etc/nginx/conf.d/ 2>/dev/null || echo "(sem conf.d)"

          # Procura por pistas, da mais específica para a mais geral.
          CONF=""; PISTA=""
          for PADRAO in "pv-harmony-hub" "homologamanager"; do
            [ -n "$CONF" ] && break
            CONF=$($S grep -rl "$PADRAO" /etc/nginx/ 2>/dev/null | grep -v '\.bak-' | head -1)
            if [ -n "$CONF" ]; then PISTA="$PADRAO"; echo "achei pela pista '$PADRAO': $CONF"; fi
          done

          if [ -z "$CONF" ]; then
            echo "ERRO: não localizei o server block do site."
            echo "=== server_name declarados ==="
            $S grep -rn "server_name\|root " /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ 2>/dev/null | head -20
            exit 1
          fi

          echo "=== conteúdo atual de $CONF ==="
          $S cat "$CONF"
          echo "=== fim ==="

          # ── 2. Desfazer ─────────────────────────────────────────────────────
          if [ "${DESFAZER:-false}" = "true" ]; then
            ULTIMO=$($S ls -1t "$CONF".bak-* 2>/dev/null | head -1)
            if [ -z "${ULTIMO:-}" ]; then echo "Nenhum backup encontrado."; exit 1; fi
            $S cp "$ULTIMO" "$CONF" && $S nginx -t && $S systemctl reload nginx \
              && echo "Restaurado de $ULTIMO" || { echo "falha ao restaurar"; exit 1; }
            exit 0
          fi

          # ── 3. Já está na versão de agora? ──────────────────────────────────
          # O marcador de fim só existe no formato atual. O de set/2026 não tem,
          # e por isso cai no caminho de atualização logo abaixo.
          if $S grep -q "$FIM" "$CONF"; then
            echo "Bloco já está na versão atual — nada a fazer."
            exit 0
          fi

          if $S grep -q "$MARCA_VELHA" "$CONF"; then
            echo "Encontrei o bloco de set/2026 (só o cache do index, e sem os"
            echo "cabeçalhos de segurança). Vou substituí-lo pelo atual."
          fi

          if [ "${SIMULAR:-false}" = "true" ]; then
            echo "SIMULAÇÃO: pararia aqui e reescreveria o bloco em $CONF."
            exit 0
          fi

          # ── 4. Aplicar ──────────────────────────────────────────────────────
          BACKUP="$CONF.bak-$(date +%Y%m%d-%H%M%S)"
          $S cp "$CONF" "$BACKUP" || { echo "ERRO: sem permissão para o backup"; exit 1; }
          echo "Backup: $BACKUP"

          # Insere no server block que contém a raiz do site. Duas exigências,
          # e as duas importam: bater a PISTA e ter uma diretiva `root`. Só a
          # pista escolheria o server de redirecionamento (que tem o mesmo
          # server_name e nenhum conteúdo) — testado, acontecia mesmo.
          #
          # Antes de inserir, o awk DESCARTA o bloco anterior, nos dois
          # formatos: o atual (entre os marcadores) e o de set/2026 (do
          # comentário da marca velha até o `}` que fecha o location, contando
          # chaves).
          $S awk -v velha="$MARCA_VELHA" -v ini="$INICIO" -v fim="$FIM" -v pista="$PISTA" '
            $0 ~ ini { pulando_novo = 1 }
            pulando_novo { if ($0 ~ fim) pulando_novo = 0; next }

            $0 ~ velha { pulando_velho = 1; chaves = 0; viu_chave = 0 }
            pulando_velho {
              chaves += gsub(/{/, "{"); chaves -= gsub(/}/, "}")
              if (chaves > 0) viu_chave = 1
              if (viu_chave && chaves == 0) pulando_velho = 0
              next
            }

            /server[[:space:]]*{/ && depth == 0 { inserver = 1; tem_root = 0; tem_pista = 0 }
            inserver { depth += gsub(/{/, "{"); depth -= gsub(/}/, "}") }
            inserver && /^[[:space:]]*root[[:space:]]/ { tem_root = 1 }
            inserver && $0 ~ pista { tem_pista = 1 }
            {
              if (inserver && tem_root && tem_pista && depth == 0 && !feito) {
                print "    # " ini
                print "    # A casca do app nao pode ficar em cache: os arquivos de"
                print "    # /assets tem hash no nome e sao imutaveis, mas e o index.html"
                print "    # que aponta para eles. Sem isto o navegador servia por horas"
                print "    # uma versao antiga do sistema. O mesmo vale para o sw.js, que"
                print "    # controla TODAS as paginas quando fica preso velho."
                print "    #"
                print "    # Os tres add_header de seguranca estao repetidos dentro de"
                print "    # cada location DE PROPOSITO: no Nginx, um add_header no"
                print "    # location cancela todos os herdados do server. Sem repetir,"
                print "    # o index.html fica sem X-Frame-Options — foi o que aconteceu"
                print "    # entre set/2026 e out/2026. Ao criar CSP ou HSTS no server,"
                print "    # repita aqui tambem."
                print "    location = /index.html {"
                print "        add_header Cache-Control \"no-cache, must-revalidate\" always;"
                print "        add_header X-Content-Type-Options \"nosniff\" always;"
                print "        add_header X-Frame-Options \"SAMEORIGIN\" always;"
                print "        add_header Referrer-Policy \"strict-origin-when-cross-origin\" always;"
                print "        expires off;"
                print "    }"
                print "    location = /sw.js {"
                print "        add_header Cache-Control \"no-cache, must-revalidate\" always;"
                print "        add_header X-Content-Type-Options \"nosniff\" always;"
                print "        add_header X-Frame-Options \"SAMEORIGIN\" always;"
                print "        add_header Referrer-Policy \"strict-origin-when-cross-origin\" always;"
                print "        expires off;"
                print "    }"
                print "    location = /manifest.webmanifest {"
                print "        # .webmanifest nao esta no mime.types padrao do Nginx, entao"
                print "        # ele sai como application/octet-stream."
                print "        types { }"
                print "        default_type application/manifest+json;"
                print "        add_header Cache-Control \"no-cache, must-revalidate\" always;"
                print "        add_header X-Content-Type-Options \"nosniff\" always;"
                print "        add_header X-Frame-Options \"SAMEORIGIN\" always;"
                print "        add_header Referrer-Policy \"strict-origin-when-cross-origin\" always;"
                print "        expires off;"
                print "    }"
                print "    # " fim
                feito = 1
              }
              print
            }
            inserver && depth == 0 { inserver = 0 }
          ' "$BACKUP" | $S tee "$CONF" > /dev/null

          if ! $S grep -q "$FIM" "$CONF"; then
            echo "ERRO: não consegui inserir o bloco — restaurando."
            $S cp "$BACKUP" "$CONF"
            exit 1
          fi

          if $S nginx -t; then
            $S systemctl reload nginx && echo "Nginx recarregado com sucesso."
          else
            echo "ERRO: configuração inválida — restaurando backup."
            $S cp "$BACKUP" "$CONF"
            $S nginx -t && $S systemctl reload nginx
            exit 1
          fi
          REMOTO

      - name: Prova — cabeçalhos servidos agora
        if: always()
        run: |
          falhou=0
          checar() { # $1 url · $2 regex esperado · $3 descrição
            saida=$(curl -sI -m 20 "https://homologamanager.com.br$1")
            echo "--- $1"
            echo "$saida" | grep -iE 'cache-control|content-type|x-content-type|x-frame|referrer' || echo "(nenhum cabeçalho relevante)"
            if echo "$saida" | grep -qiE "$2"; then
              echo "    OK: $3"
            else
              echo "    FALHOU: esperava $3"
              falhou=1
            fi
          }
          checar "/"                      'cache-control:.*no-cache'            'index.html sem cache'
          checar "/"                      'x-frame-options'                     'index.html com X-Frame-Options'
          checar "/sw.js"                 'cache-control:.*no-cache'            'sw.js sem cache'
          checar "/manifest.webmanifest"  'content-type:.*application/manifest' 'manifest com o MIME certo'
          ASSET=$(curl -s -m 20 https://homologamanager.com.br/ | grep -o 'assets/index-[A-Za-z0-9._-]*\.js' | head -1)
          echo "--- /$ASSET (deve seguir imutável, com cache longo)"
          curl -sI -m 20 "https://homologamanager.com.br/$ASSET" | grep -i 'cache-control' || true
          exit $falhou

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
