name: Assinador — deploy do robô na VPS

# Execução MANUAL (aba Actions → este workflow → "Run workflow").
#
# O que faz: roda os testes e compila worker/assinador no CI, sincroniza para
# /opt/gdm-assinador na VPS e roda deploy/instalar.sh por SSH — que instala
# Node 22 e o LibreOffice (se faltarem), grava o ambiente em
# /etc/gdm-assinador/env e (re)inicia o serviço systemd `gdm-assinador`.
# Idempotente.
#
# Segredos necessários (Settings → Secrets → Actions) — os mesmos da Ludmilla:
#   VPS_HOST, VPS_USER, VPS_SSH_PORT, VPS_SSH_KEY
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
#
# A service role decifra a senha do certificado (via RPC): ela só existe no
# segredo do GitHub e em /etc/gdm-assinador/env (600, root) na VPS.
# Nunca no repositório, nunca na conversa.

on:
  workflow_dispatch:
    inputs:
      simular:
        description: 'Só diagnosticar na VPS, sem instalar nada'
        type: boolean
        default: false

concurrency:
  group: assinador-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/assinador/package-lock.json

      # O LibreOffice entra aqui para os testes de conversão rodarem de verdade
      # no CI (na máquina de quem desenvolve eles são pulados). No CI (CI=true)
      # a ausência do soffice FALHA esses testes, de propósito.
      - name: LibreOffice
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc libreoffice-writer

      - name: Testes do assinador
        working-directory: worker/assinador
        run: |
          npm ci
          npm test

      - name: Compilar
        working-directory: worker/assinador
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.VPS_SSH_PORT }} -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sincronizar código
        if: ${{ !inputs.simular }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_SSH_PORT }} -o StrictHostKeyChecking=no"
          $SSH ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'mkdir -p /opt/gdm-assinador'
          # só o necessário para rodar: dist/ (compilado acima — não está no git),
          # manifesto, lockfile e deploy/. O node_modules da VPS é preservado
          # (--delete não apaga o que está excluído).
          rsync -avz --delete -e "$SSH" \
            --exclude='node_modules' --exclude='dist-test' --exclude='test' --exclude='src' \
            --exclude='_*' --exclude='*.pfx' --exclude='*.pdf' \
            worker/assinador/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/gdm-assinador/

      - name: Instalar / reiniciar
        env:
          SIMULAR: ${{ inputs.simular }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_SSH_PORT }} -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "SIMULAR='$SIMULAR' SUPABASE_URL='$SUPABASE_URL' SUPABASE_SERVICE_ROLE_KEY='$SUPABASE_SERVICE_ROLE_KEY' bash -s" \
            < worker/assinador/deploy/instalar.sh
