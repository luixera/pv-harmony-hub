name: Deploy para produção

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true  # Não bloqueia o deploy do frontend se falhar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy scan-emails
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy scan-emails \
            --project-ref yqsqrdndvsnhbsoaoilf \
            --no-verify-jwt

      - name: Deploy test-gmail
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy test-gmail \
            --project-ref yqsqrdndvsnhbsoaoilf \
            --no-verify-jwt

      # Estava fora do CI e era publicada à mão, o que já causou uma
      # publicação com conteúdo errado. Sem verify-jwt: a função faz a própria
      # checagem do header Authorization.
      - name: Deploy claudinho-verifica
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy claudinho-verifica \
            --project-ref yqsqrdndvsnhbsoaoilf \
            --no-verify-jwt

      # Leitor de datasheet do Motor de Engenharia. Faz a própria checagem do
      # header Authorization e consome cota de IA (consume_ai_quota).
      - name: Deploy datasheet-extract
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy datasheet-extract \
            --project-ref yqsqrdndvsnhbsoaoilf \
            --no-verify-jwt

      # Sem verify-jwt: o login que falhou ainda não tem sessão. A proteção
      # é a lista fechada de ações + limite por IP dentro da própria função.
      - name: Deploy log-event
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy log-event \
            --project-ref yqsqrdndvsnhbsoaoilf \
            --no-verify-jwt

  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          # Escreve a chave preservando newlines (evita chave inválida)
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.VPS_SSH_PORT }} -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || echo "keyscan skipped, using StrictHostKeyChecking=no"

      # Os arquivos de /assets têm hash no nome, então versões diferentes
      # convivem. Apagá-los no deploy quebra quem está com a aba aberta: o
      # index.html velho continua pedindo o pedaço antigo (ex.: o gerador de
      # PDF, que carrega sob demanda) e recebe 404 — o botão simplesmente para
      # de funcionar sem erro nenhum na tela. Por isso o --delete NÃO vale para
      # /assets; a limpeza vem depois, só no que já está velho.
      - name: Rsync para VPS
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_SSH_PORT }} -o StrictHostKeyChecking=no"
          DEST=${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/pv-harmony-hub/dist/
          # 1) assets novos SOMAM (sem --delete): as versões antigas continuam
          #    no ar para as abas que ainda estão abertas
          rsync -avz -e "$SSH" dist/assets/ "$DEST"assets/
          # 2) o resto do site espelha o build (aí sim com --delete); 'assets'
          #    fica de fora e, por estar excluído, também não é apagado
          rsync -avz --delete --exclude='.env*' --exclude='assets/' \
            -e "$SSH" dist/ "$DEST"

      # Assets de mais de 30 dias já não têm aba aberta apontando pra eles.
      - name: Limpar assets antigos
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_SSH_PORT }} -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "find /var/www/pv-harmony-hub/dist/assets -type f -mtime +30 -delete || true"

      - name: Ajustar ownership
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_SSH_PORT }} -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "chown -R www-data:www-data /var/www/pv-harmony-hub/dist"

      - name: Smoke test
        run: |
          sleep 2
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://homologamanager.com.br/)
          if [ "$STATUS" = "200" ]; then
            echo "Site online (HTTP $STATUS)"
          else
            echo "Site retornou HTTP $STATUS"
            exit 1
          fi

      # Registra a publicação no painel de monitoramento, para dar
      # para cruzar "começou a dar erro depois da versão X".
      - name: Registrar deploy no painel
        if: always()
        continue-on-error: true
        env:
          # Reaproveita os segredos que o build já usa: o único novo a
          # cadastrar é o DEPLOY_LOG_TOKEN.
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          DEPLOY_LOG_TOKEN: ${{ secrets.DEPLOY_LOG_TOKEN }}
          ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$DEPLOY_LOG_TOKEN" ] || [ -z "$SUPABASE_URL" ]; then
            echo "Segredos de log ausentes — pulando."; exit 0
          fi
          MSG=$(git log -1 --pretty=%s | head -c 300)
          curl -s -m 20 -X POST "$SUPABASE_URL/functions/v1/log-event" \
            -H "Content-Type: application/json" \
            -H "apikey: $ANON_KEY" \
            -H "x-deploy-token: $DEPLOY_LOG_TOKEN" \
            -d "$(jq -n --arg m "$MSG" --arg sha "$GITHUB_SHA" \
                       --arg ref "$GITHUB_REF_NAME" --arg st "${{ job.status }}" \
                  '{action:"deploy", message:$m,
                    metadata:{commit:$sha, branch:$ref, resultado:$st,
                              run:"'"$GITHUB_RUN_ID"'"}}')" || true

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
