<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enviar para a Ludmilla</title>
    <style>
      :root { color-scheme: light; }
      body {
        width: 300px; margin: 0; padding: 16px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #0F3D4C; background: #FFFFFF;
      }
      h1 { font-size: 15px; margin: 0 0 4px; }
      p.sub { margin: 0 0 12px; font-size: 12px; color: #5b7682; }
      #estado { font-size: 14px; line-height: 1.4; min-height: 40px; }
      button {
        width: 100%; margin-top: 12px; padding: 10px 12px; border: 0; border-radius: 8px;
        font-size: 14px; font-weight: 700; cursor: pointer; background: #F2B705; color: #0F3D4C;
      }
      button:disabled { background: #e7eef0; color: #9bb0b8; cursor: default; }
      a { color: #0F3D4C; font-size: 12px; }
      .rodape { margin-top: 12px; text-align: center; }
    </style>
  </head>
  <body>
    <h1>Ludmilla — Elektro</h1>
    <p class="sub">Leio a lista que está na sua tela. Só leitura.</p>
    <div id="estado">Lendo a página…</div>
    <button id="enviar" disabled>Enviar para a Ludmilla</button>
    <div class="rodape"><a href="#" id="abrirOpcoes">Opções (chave)</a></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
