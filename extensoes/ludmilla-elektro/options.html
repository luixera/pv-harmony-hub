<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opções — Ludmilla Elektro</title>
    <style>
      :root { color-scheme: light; }
      body {
        max-width: 520px; margin: 32px auto; padding: 0 20px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #0F3D4C;
      }
      h1 { font-size: 18px; }
      p { font-size: 13px; line-height: 1.5; color: #44606a; }
      label { display: block; font-weight: 700; margin: 16px 0 4px; font-size: 13px; }
      input {
        width: 100%; box-sizing: border-box; padding: 9px 10px; font-size: 13px;
        border: 1px solid #c7d6db; border-radius: 8px; font-family: ui-monospace, monospace;
      }
      button {
        margin-top: 16px; padding: 10px 16px; border: 0; border-radius: 8px;
        font-size: 14px; font-weight: 700; cursor: pointer; background: #F2B705; color: #0F3D4C;
      }
      #estado { margin-top: 12px; font-size: 13px; min-height: 18px; }
    </style>
  </head>
  <body>
    <h1>Ludmilla — Elektro</h1>
    <p>
      Cole aqui a chave que você gera no GD Manager, em <strong>Concessionárias → Elektro →
      Chaves da API</strong>. Ela fica guardada só nesta extensão, nunca na página do portal.
    </p>
    <label for="chave">Chave da API (gdm_…)</label>
    <input id="chave" type="password" placeholder="gdm_0000000000000000000000000000000000000000" autocomplete="off" spellcheck="false" />
    <label for="url">Endereço da API</label>
    <input id="url" type="text" spellcheck="false" />
    <p style="font-size:12px;color:#6b828a">Normalmente não precisa mexer no endereço.</p>
    <button id="salvar">Salvar</button>
    <div id="estado"></div>
    <script type="module" src="options.js"></script>
  </body>
</html>
